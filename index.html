<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유숙형 — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --paper:#FFFFFF; --ink:#0E0E0C; --ink-soft:#6A6A64; --hair:rgba(14,14,12,0.15); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Pretendard', -apple-system, sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; position:relative; }

  .regmark{ position:fixed; width:18px; height:18px; pointer-events:none; z-index:5; opacity:0.35; }
  .regmark::before,.regmark::after{ content:""; position:absolute; background:var(--ink); }
  .regmark::before{ left:50%; top:0; width:1px; height:100%; transform:translateX(-50%); }
  .regmark::after{ top:50%; left:0; height:1px; width:100%; transform:translateY(-50%); }
  .rm-tl{ top:12px; left:12px; } .rm-tr{ top:12px; right:12px; }
  .rm-bl{ bottom:12px; left:12px; } .rm-br{ bottom:12px; right:12px; }

  header{ position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--hair); padding:22px 44px; display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; }
  .current-label{ font-size:15px; text-decoration:underline; text-underline-offset:4px; justify-self:start; }
  .wordmark{ font-family:'Newsreader', serif; font-style:italic; font-size:19px; letter-spacing:0.01em; color:var(--ink); text-decoration:none; white-space:nowrap; justify-self:center; }
  .menu-btn{ justify-self:end; background:none; border:none; font-family:'Pretendard',sans-serif; font-size:15px; color:var(--ink); cursor:pointer; padding:0; }

  .menu-panel{ position:sticky; top:65px; z-index:29; background:#fff; border-bottom:1px solid var(--hair); max-height:0; overflow:hidden; transition:max-height 0.28s ease; }
  .menu-panel.open{ max-height:280px; }
  .menu-panel-inner{ padding:14px 44px 26px; display:flex; flex-direction:column; }
  .menu-panel-inner button{ background:none; border:none; text-align:left; font-family:'Newsreader',serif; font-style:italic; font-size:22px; color:var(--ink); padding:9px 0; cursor:pointer; border-bottom:1px solid var(--hair); }
  .menu-panel-inner button:last-child{ border-bottom:none; }
  .menu-panel-inner button:hover{ color:var(--ink-soft); }

  main{ max-width:960px; margin:0 auto; padding:60px 44px 130px; }
  section{ display:none; }
  section.active{ display:block; }

  h1.section-title{ font-family:'Newsreader', serif; font-weight:400; font-style:italic; font-size:15px; margin:0 0 40px; color:var(--ink-soft); }

  .cv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px solid var(--hair); }
  .cv-col{ padding:32px 32px 0 0; }
  .cv-col.en{ padding:32px 0 0 32px; border-left:1px solid var(--hair); }
  .cv-name{ font-size:16px; font-weight:500; margin:0 0 4px; }
  .cv-sub{ font-size:14px; color:var(--ink-soft); margin:0 0 30px; }
  .cv-section{ margin-bottom:26px; }
  .cv-section h3{ font-size:13px; font-weight:500; margin:0 0 10px; }
  .cv-section .row{ font-size:14px; line-height:1.85; }
  .cv-section .row .b{ color:var(--ink-soft); }
  .ph{ font-size:13px; color:var(--ink-soft); font-style:italic; }

  .work-layout{ display:flex; gap:36px; align-items:flex-start; }
  .year-tabs{ display:flex; flex-direction:column; gap:2px; flex:0 0 56px; position:sticky; top:130px; }
  .year-tabs button{ background:none; border:none; font-family:'Pretendard',sans-serif; font-size:12px; color:var(--ink-soft); padding:5px 0; cursor:pointer; position:relative; text-align:left; }
  .year-tabs button.active{ color:var(--ink); }
  .year-tabs button.active::before{ content:""; position:absolute; left:-10px; top:3px; bottom:3px; width:2px; background:var(--ink); }
  #yearPanels{ flex:1; min-width:0; }
  .year-panel{ display:none; }
  .year-panel.active{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; align-content:start; }
  .work-thumb{ aspect-ratio:4/5; border:1px solid var(--hair); cursor:pointer; background-size:cover; background-position:center; transition:opacity 0.15s ease; }
  .work-thumb.ph-bg{ background-image:repeating-linear-gradient(135deg, transparent, transparent 7px, var(--hair) 7px, var(--hair) 8px); }
  .work-thumb:hover{ opacity:0.6; }
  .empty-year{ font-size:13.5px; color:var(--ink-soft); font-style:italic; padding:0; grid-column:1 / -1; }

  .lightbox{ position:fixed; inset:0; z-index:50; background:rgba(255,255,255,0.97); display:none; align-items:center; justify-content:center; flex-direction:column; padding:60px 24px; cursor:zoom-out; }
  .lightbox.open{ display:flex; }
  .lightbox-img{ width:min(560px, 90vw); aspect-ratio:4/5; border:1px solid var(--hair); background-size:cover; background-position:center; margin-bottom:18px; }
  .lightbox-img.ph-bg{ background-image:repeating-linear-gradient(135deg, transparent, transparent 7px, var(--hair) 7px, var(--hair) 8px); }
  .lightbox-caption{ font-size:13.5px; color:var(--ink-soft); text-align:center; cursor:auto; }
  .lightbox-close{ position:absolute; top:24px; right:32px; background:none; border:none; font-size:14px; color:var(--ink-soft); cursor:pointer; font-family:'Pretendard',sans-serif; }
  .lightbox-close:hover{ color:var(--ink); }

  .ex-list{ display:flex; flex-direction:column; }
  .ex-list-item{ display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--hair); padding:18px 0; cursor:pointer; font-family:'Pretendard',sans-serif; }
  .ex-list-item .ttl{ font-size:16px; margin:0 0 3px; }
  .ex-list-item .venue{ font-size:13px; color:var(--ink-soft); margin:0; }
  .ex-list-item:hover .ttl{ color:var(--ink-soft); }
  .ex-status{ font-size:10.5px; border:1px solid var(--ink-soft); color:var(--ink-soft); padding:1px 6px; margin-left:8px; }

  .ex-detail{ display:none; }
  .ex-detail.active{ display:block; }
  .ex-back{ background:none; border:none; font-size:13.5px; color:var(--ink-soft); cursor:pointer; padding:0 0 30px; font-family:'Pretendard',sans-serif; }
  .ex-back:hover{ color:var(--ink); }
  .ex-detail h2{ font-family:'Newsreader',serif; font-style:italic; font-weight:400; font-size:26px; margin:0 0 4px; }
  .ex-detail .venue{ font-size:14px; color:var(--ink-soft); margin:0 0 34px; }
  .install-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .install-shot{ aspect-ratio:3/2; border:1px solid var(--hair); background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink-soft); }
  .install-shot.ph-bg{ background-image:repeating-linear-gradient(135deg, transparent, transparent 7px, var(--hair) 7px, var(--hair) 8px); }

  .text-list{ display:flex; flex-direction:column; }
  .text-row{ display:flex; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1px solid var(--hair); font-size:15px; }
  .text-row .yr{ color:var(--ink-soft); font-size:13.5px; white-space:nowrap; }

  .contact-wrap{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:40px 0 20px; }
  .contact-wrap a{ color:var(--ink); font-size:16px; text-decoration:none; }
  .contact-wrap a:hover{ color:var(--ink-soft); }
  .contact-gap{ height:34px; }

  @media (max-width:720px){
    header{ padding:16px 20px; }
    .menu-panel-inner{ padding:12px 20px 22px; }
    main{ padding:36px 20px 90px; }
    .cv-grid{ grid-template-columns:1fr; }
    .cv-col.en{ border-left:none; border-top:1px solid var(--hair); padding:32px 0 0; margin-top:8px; }
    .cv-col{ padding:32px 0 0; }
    .install-grid{ grid-template-columns:1fr; }
    .regmark{ display:none; }
    .work-layout{ gap:20px; }
    .year-tabs{ flex:0 0 40px; position:static; }
  }
</style>
</head>
<body>

<div class="regmark rm-tl"></div>
<div class="regmark rm-tr"></div>
<div class="regmark rm-bl"></div>
<div class="regmark rm-br"></div>

<header>
  <span class="current-label" id="currentLabel"></span>
  <a href="#" class="wordmark" onclick="showSection('landing');return false;">유숙형</a>
  <button class="menu-btn" onclick="toggleMenu()">Menu</button>
</header>

<div class="menu-panel" id="menuPanel">
  <div class="menu-panel-inner">
    <button onclick="showSection('about')">About</button>
    <button onclick="showSection('work')">Work</button>
    <button onclick="showSection('exhibitions')">Exhibitions</button>
    <button onclick="showSection('text')">Text</button>
    <button onclick="showSection('contact')">Contact</button>
  </div>
</div>

<main>
  <section id="landing"></section>

  <section id="about">
    <h1 class="section-title">About</h1>
    <div class="cv-grid">
      <div class="cv-col kr" id="cvKR"></div>
      <div class="cv-col en" id="cvEN"></div>
    </div>
  </section>

  <section id="work">
    <h1 class="section-title">Work</h1>
    <div class="work-layout">
      <div class="year-tabs" id="yearTabs"></div>
      <div id="yearPanels"></div>
    </div>
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
      <button class="lightbox-close" onclick="closeLightbox(event)">닫기 ✕</button>
      <div class="lightbox-img" id="lightboxImg"></div>
      <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>
  </section>

  <section id="exhibitions">
    <h1 class="section-title">Exhibitions</h1>
    <div class="ex-list" id="exList"></div>
    <div id="exDetails"></div>
  </section>

  <section id="text">
    <h1 class="section-title">Text</h1>
    <div class="text-list" id="textList"></div>
  </section>

  <section id="contact">
    <h1 class="section-title">Contact</h1>
    <div class="contact-wrap" id="contactWrap"></div>
  </section>
</main>

<script>
  // ---- Supabase 설정 : admin.html과 동일한 값으로 채워넣기 ----
  var SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
  var SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';
  var BUCKET = 'portfolio-images';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function signedUrl(path){
    if(!path) return Promise.resolve(null);
    return sb.storage.from(BUCKET).createSignedUrl(path, 3600).then(function(res){
      if(res.error){ console.error(res.error); return null; }
      return res.data.signedUrl;
    });
  }

  var DATA = null;
  var YEARS = [2026,2025,2024,2023,2022,2021,2020,2019,2018,2017,2016,2015];

  function isPH(t){ return typeof t === 'string' && t.indexOf('［') > -1; }

  var CV_LABELS = {
    education:{kr:'학력', en:'Education'},
    solo:{kr:'주요 개인전', en:'Selected Solo Exhibitions'},
    group:{kr:'주요 단체전', en:'Selected Group Exhibitions'},
    awards:{kr:'수상', en:'Awards'},
    collections:{kr:'소장처', en:'Collections'}
  };
  var CV_ORDER = ['education','solo','group','awards','collections'];

  function renderCVCol(col, lang){
    var html = '<p class="cv-name">' + col.name + '</p>';
    html += '<p class="cv-sub' + (isPH(col.sub)?' ph':'') + '">' + col.sub + '</p>';
    CV_ORDER.forEach(function(key){
      var rows = col[key] || [];
      html += '<div class="cv-section"><h3>' + CV_LABELS[key][lang] + '</h3>';
      rows.forEach(function(r){
        html += '<div class="row' + (isPH(r.text)?' ph':'') + '">' + (r.year ? '<span class="b">' + r.year + '</span> ' : '') + r.text + '</div>';
      });
      html += '</div>';
    });
    return html;
  }

  function renderAbout(){
    document.getElementById('cvKR').innerHTML = renderCVCol(DATA.about.kr, 'kr');
    document.getElementById('cvEN').innerHTML = renderCVCol(DATA.about.en, 'en');
  }

  function renderWork(){
    var tabs = document.getElementById('yearTabs');
    var panels = document.getElementById('yearPanels');
    tabs.innerHTML = ''; panels.innerHTML = '';
    YEARS.forEach(function(y, i){
      var btn = document.createElement('button');
      btn.textContent = y;
      btn.dataset.year = y;
      if(i===0) btn.classList.add('active');
      btn.onclick = function(){ showYear(y); };
      tabs.appendChild(btn);

      var panel = document.createElement('div');
      panel.className = 'year-panel' + (i===0 ? ' active' : '');
      panel.id = 'year-' + y;

      var items = DATA.work[y] || [];
      if(items.length){
        items.forEach(function(w){
          var thumb = document.createElement('div');
          thumb.className = 'work-thumb ph-bg';
          thumb.onclick = function(){ openLightbox(w); };
          panel.appendChild(thumb);
          if(w.image){
            signedUrl(w.image).then(function(url){
              if(!url) return;
              thumb.classList.remove('ph-bg');
              thumb.style.backgroundImage = "url('" + url + "')";
            });
          }
        });
      } else {
        var empty = document.createElement('p');
        empty.className = 'empty-year';
        empty.textContent = '［　　' + y + '년 작업 추가 예정　　］';
        panel.appendChild(empty);
      }
      panels.appendChild(panel);
    });
  }
  function showYear(y){
    document.querySelectorAll('#yearTabs button').forEach(function(b){ b.classList.toggle('active', Number(b.dataset.year)===Number(y)); });
    document.querySelectorAll('.year-panel').forEach(function(p){ p.classList.toggle('active', p.id === 'year-'+y); });
  }
  function openLightbox(w){
    var img = document.getElementById('lightboxImg');
    img.classList.add('ph-bg');
    img.style.backgroundImage = '';
    if(w.image){
      signedUrl(w.image).then(function(url){
        if(!url) return;
        img.classList.remove('ph-bg');
        img.style.backgroundImage = "url('" + url + "')";
      });
    }
    document.getElementById('lightboxCaption').textContent = w.name + ', ' + w.title + ', ' + w.year + ', ' + w.medium + ', ' + w.size;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox(e){ if(e) e.stopPropagation(); document.getElementById('lightbox').classList.remove('open'); }

  function renderExhibitions(){
    var list = document.getElementById('exList');
    var details = document.getElementById('exDetails');
    list.innerHTML = ''; details.innerHTML = '';
    DATA.exhibitions.forEach(function(ex){
      var btn = document.createElement('button');
      btn.className = 'ex-list-item';
      btn.onclick = function(){ openExhibition(ex.id); };
      var ttl = document.createElement('p');
      ttl.className = 'ttl' + (isPH(ex.title) ? ' ph' : '');
      ttl.innerHTML = (ex.year ? ex.year + ' &nbsp;' : '') + ex.title + (ex.status ? '<span class="ex-status">' + ex.status + '</span>' : '');
      var venue = document.createElement('p');
      venue.className = 'venue' + (isPH(ex.venue) ? ' ph' : '');
      venue.textContent = ex.venue || '\u00a0';
      btn.appendChild(ttl); btn.appendChild(venue);
      list.appendChild(btn);

      var detail = document.createElement('div');
      detail.className = 'ex-detail';
      detail.id = 'ex-' + ex.id;
      var h2 = document.createElement('h2');
      h2.className = isPH(ex.title) ? 'ph' : '';
      h2.textContent = ex.title.replace(/[《》]/g,'');
      var venue2 = document.createElement('p');
      venue2.className = 'venue' + (isPH(ex.venue) ? ' ph' : '');
      venue2.textContent = (ex.year ? ex.year + ' · ' : '') + (ex.venue || '');
      var back = document.createElement('button');
      back.className = 'ex-back';
      back.textContent = '← 목록으로';
      back.onclick = closeExhibition;
      var grid = document.createElement('div');
      grid.className = 'install-grid';
      var imgs = ex.images && ex.images.length ? ex.images : [null,null];
      imgs.forEach(function(path){
        var shot = document.createElement('div');
        shot.className = 'install-shot ph-bg';
        if(!path){ shot.textContent = '전시전경 준비 중'; }
        grid.appendChild(shot);
        if(path){
          signedUrl(path).then(function(url){
            if(!url) return;
            shot.classList.remove('ph-bg');
            shot.style.backgroundImage = "url('" + url + "')";
          });
        }
      });
      detail.appendChild(back); detail.appendChild(h2); detail.appendChild(venue2); detail.appendChild(grid);
      details.appendChild(detail);
    });
  }
  function openExhibition(id){
    document.getElementById('exList').style.display = 'none';
    document.querySelectorAll('.ex-detail').forEach(function(d){ d.classList.remove('active'); });
    document.getElementById('ex-' + id).classList.add('active');
  }
  function closeExhibition(){
    document.querySelectorAll('.ex-detail').forEach(function(d){ d.classList.remove('active'); });
    document.getElementById('exList').style.display = '';
  }

  function renderText(){
    var wrap = document.getElementById('textList');
    wrap.innerHTML = '';
    DATA.text.forEach(function(t){
      var row = document.createElement('div');
      row.className = 'text-row';
      row.innerHTML = '<span' + (isPH(t.title)?' class="ph"':'') + '>' + t.title + '</span><span class="yr">' + t.year + '</span>';
      wrap.appendChild(row);
    });
  }

  function renderContact(){
    var c = DATA.contact;
    var wrap = document.getElementById('contactWrap');
    var emailHTML = c.email
      ? '<a href="mailto:' + c.email + '">' + c.email + '</a>'
      : '<a href="#" class="ph">［　　이메일 주소 입력　　］</a>';
    var igHTML = c.instagram
      ? '<a href="' + c.instagram + '" target="_blank" rel="noopener">' + c.instagram + '</a>'
      : '<a href="#" class="ph">［　　인스타그램 링크 입력　　］</a>';
    wrap.innerHTML = emailHTML + '<div class="contact-gap"></div>' + igHTML;
  }

  function toggleMenu(){ document.getElementById('menuPanel').classList.toggle('open'); }

  function showSection(id){
    document.querySelectorAll('main section').forEach(function(s){ s.classList.toggle('active', s.id === id); });
    var labels = { landing:'', about:'About', work:'Work', exhibitions:'Exhibitions', text:'Text', contact:'Contact' };
    document.getElementById('currentLabel').textContent = labels[id] || '';
    document.getElementById('menuPanel').classList.remove('open');
    window.scrollTo(0,0);
    history.replaceState(null, '', '#' + id);
  }

  var SITE_DATA_PATH = 'site/data.json';

  sb.storage.from(BUCKET).createSignedUrl(SITE_DATA_PATH, 60)
    .then(function(res){
      if(res.error) throw res.error;
      return fetch(res.data.signedUrl);
    })
    .then(function(r){ return r.json(); })
    .then(function(json){
      DATA = json;
      renderAbout(); renderWork(); renderExhibitions(); renderText(); renderContact();
      var initial = (location.hash || '#landing').replace('#','');
      var valid = ['landing','about','work','exhibitions','text','contact'];
      showSection(valid.includes(initial) ? initial : 'landing');
    })
    .catch(function(err){
      document.querySelector('main').innerHTML =
        '<p style="font-size:14px;color:#6A6A64;padding-top:40px;">사이트 데이터를 불러오지 못했습니다. admin 페이지에서 한 번 저장했는지, SUPABASE_URL/SUPABASE_ANON_KEY 값이 올바른지 확인해주세요.</p>';
      console.error(err);
    });
</script>

</body>
</html>
